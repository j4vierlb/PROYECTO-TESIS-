# Configuración de nginx para el panel web (lo usa el Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Si la ruta no es un archivo (ej: /clientes), se entrega index.html y
    # React decide qué pantalla mostrar. Sin esto, recargar la página daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan un código en el nombre que cambia en cada
    # versión, así que el navegador los puede guardar en caché sin riesgo.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
